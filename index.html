<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Career Navigator AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout concept: product-style SaaS shell. Sticky top bar, one hash-routed view below, cards only where an object needs setting off. */
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface2:#F0F2F9; --ink:#0E1A3A; --ink2:#4B5679; --ink3:#7F89A8;
  --line:#E3E7F1; --blue:#2859E6; --blue-soft:#E9EFFF; --violet:#7656E8; --violet-soft:#F0EBFF;
  --good:#1A8A57; --good-soft:#E3F5EC; --warn:#A8680E; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(14,26,58,.05),0 6px 20px rgba(14,26,58,.06);
  --shadow-lg:0 2px 4px rgba(14,26,58,.05),0 24px 60px rgba(30,50,120,.14);
  --head:'Manrope','Inter',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px; --r-sm:8px; --hdr:rgba(246,247,251,.86);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1124; --surface:#131B33; --surface2:#1A2442; --ink:#E9EDFA; --ink2:#A4AECF; --ink3:#7882A5;
  --line:#25304F; --blue:#6C8DFF; --blue-soft:#1B2A57; --violet:#A18BFF; --violet-soft:#272050;
  --good:#4CC38A; --good-soft:#12312A; --warn:#E5A94A; --warn-soft:#3A2D12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.45); --hdr:rgba(11,17,36,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1124; --surface:#131B33; --surface2:#1A2442; --ink:#E9EDFA; --ink2:#A4AECF; --ink3:#7882A5;
  --line:#25304F; --blue:#6C8DFF; --blue-soft:#1B2A57; --violet:#A18BFF; --violet-soft:#272050;
  --good:#4CC38A; --good-soft:#12312A; --warn:#E5A94A; --warn-soft:#3A2D12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.45); --hdr:rgba(11,17,36,.86); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--head);letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;stroke-width:1.9;flex:none}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{padding-block:36px 72px}
.muted{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink3)}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 17px var(--head);letter-spacing:-.02em;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,var(--blue),var(--violet));display:grid;place-items:center;color:#fff}
.logo-mark .ic{width:17px;height:17px;stroke:#fff}
.nav{display:flex;gap:2px;margin-left:12px;min-width:0}
.nav a{padding:8px 12px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:14px;transition:.15s;white-space:nowrap}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{color:var(--ink);background:var(--surface2)}
.hdr-cta{margin-left:auto;display:flex;gap:8px;align-items:center}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;place-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;line-height:1.2;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 16px -6px var(--blue)}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface2)}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-soft:hover{filter:brightness(.97)}
.btn-lg{padding:14px 22px;font-size:15px;border-radius:12px}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);transition:.15s}
.icon-btn:hover{color:var(--blue);border-color:var(--blue)}
.icon-btn.on{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.icon-btn.on .ic{fill:currentColor}
/* cards & bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2);font-size:12.5px;font-weight:500;border:1px solid transparent}
button.chip{border-color:var(--line);background:var(--surface)}
button.chip:hover{border-color:var(--blue);color:var(--blue)}
button.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--violet);background:var(--violet-soft);padding:3px 9px;border-radius:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--blue-soft);color:var(--ink);font-size:13.5px;line-height:1.55}
.callout .ic{color:var(--blue);margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--violet));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes slide{from{opacity:0;transform:translateX(14px)}}
.enter{animation:slide .3s ease both}
.page>*{animation:rise .35s ease both}
.h-page{font-size:clamp(1.7rem,3.2vw,2.3rem);margin-bottom:8px}
.sec{margin-top:40px}
.sec>h2{font-size:1.25rem;margin-bottom:14px}
/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
 radial-gradient(900px 420px at 85% -10%,color-mix(in srgb,var(--blue) 14%,transparent),transparent 70%),
 radial-gradient(600px 360px at 10% 110%,color-mix(in srgb,var(--violet) 10%,transparent),transparent 70%),var(--bg)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.45;mask-image:linear-gradient(180deg,#000,transparent 80%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 80%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:72px 80px}
.hero h1{font-size:clamp(2.3rem,5vw,3.7rem);font-weight:800;letter-spacing:-.035em;line-height:1.04}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero .lead{font-size:1.1rem;color:var(--ink2);margin-top:20px;max-width:34em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.proof{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--ink2);font-size:13px}
.proof span{display:inline-flex;gap:6px;align-items:center}
.proof .ic{width:15px;height:15px;color:var(--good)}
.win{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.win-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.win-bar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.win-bar b{margin-left:8px;font:600 12px var(--body);color:var(--ink3)}
.win-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:14px}
.mini-rec{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.mini-rec:last-child{border:0}
.mini-rec span:last-child{color:var(--blue);font-variant-numeric:tabular-nums}
/* sections on landing */
.band{padding-block:72px}
.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.band h2{font-size:clamp(1.6rem,3vw,2.2rem);max-width:20em}
.band .sub{color:var(--ink2);margin-top:10px;max-width:38em}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:36px}
.step{padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.step .n{font:800 13px var(--head);color:var(--blue);background:var(--blue-soft);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;margin-bottom:16px}
.step h3{font-size:1.05rem;margin-bottom:6px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:32px}
.cat{display:flex;gap:12px;align-items:center;padding:14px 16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:.15s}
.cat:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow)}
.cat .tile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.cat b{display:block;font-size:14px}
.cat small{color:var(--ink3);font-size:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center}
.ticks{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.ticks li{display:flex;gap:10px;color:var(--ink2)}
.ticks .ic{color:var(--good);margin-top:3px}
.cta-final{margin:0 auto;text-align:center;padding:56px 24px;border-radius:18px;background:linear-gradient(135deg,#1B2F7A,#3B2C98);color:#fff}
.cta-final h2{color:#fff;margin:0 auto}
.cta-final p{color:#C9D2F5;margin:12px auto 24px;max-width:34em}
.cta-final .btn-primary{background:#fff;color:#1B2F7A;box-shadow:none}
.foot{border-top:1px solid var(--line);padding-block:40px 28px;margin-top:0;color:var(--ink2);font-size:13.5px}
.foot .cols{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:32px}
.foot h4{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:10px}
.foot a{display:block;padding:3px 0}.foot a:hover{color:var(--blue)}
/* assessment */
.q-shell{max-width:720px;margin:0 auto}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.prog .bar{flex:1}
.q-card{padding:30px}
.q-card h2{font-size:clamp(1.25rem,2.4vw,1.6rem);margin:12px 0 6px}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:.15s}
.opt:hover{border-color:color-mix(in srgb,var(--blue) 55%,var(--line));background:var(--surface2)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.15s}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .dot{border-color:var(--blue);background:var(--blue)}
.opt.sel .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:24px}
.likert button{padding:18px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:700 18px var(--head);transition:.15s}
.likert button:hover{border-color:var(--blue)}
.likert button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.scale-l{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink3)}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
/* results */
.trait-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 38px;gap:12px;align-items:center;padding:8px 0}
.trait-row b{font-size:13.5px;font-weight:600}
.trait-row .v{font:700 14px var(--head);text-align:right;font-variant-numeric:tabular-nums}
.rec{padding:0;overflow:hidden}
.rec-top{display:flex;gap:16px;padding:20px 22px;align-items:flex-start}
.rank{font:800 13px var(--head);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);flex:none}
.rec-main{flex:1;min-width:0}
.rec-main h3{font-size:1.1rem}
.score{text-align:right;flex:none}
.score b{display:block;font:800 22px var(--head);color:var(--blue);font-variant-numeric:tabular-nums}
.band-l{font-size:11.5px;font-weight:600;color:var(--ink3)}
details.why{border-top:1px solid var(--line)}
details.why summary{list-style:none;cursor:pointer;padding:12px 22px;font-weight:600;font-size:13.5px;color:var(--blue);display:flex;align-items:center;gap:8px}
details.why summary::-webkit-details-marker{display:none}
details.why[open] summary .ic{transform:rotate(90deg)}
details.why summary .ic{transition:transform .2s}
.why-body{padding:2px 22px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.why-body h4{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:8px}
.why-body ul{margin:0;padding-left:18px;color:var(--ink2);display:grid;gap:6px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* explorer */
.filters{padding:18px;display:grid;gap:14px}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;width:100%}
.search input{padding-left:38px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.lbl{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:8px;display:block}
.ccard{position:relative;padding:20px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.ccard .a{position:absolute;inset:0;border-radius:var(--r)}
.ccard .save{position:relative;z-index:2}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.ccard h3{font-size:1.05rem}
.ccard p{color:var(--ink2);font-size:14px;flex:1}
.match-b{font:700 12px var(--head);color:var(--good);background:var(--good-soft);padding:3px 8px;border-radius:6px}
/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start;margin-top:26px}
.panel{padding:24px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:1.1rem;margin-bottom:12px}
.panel ul{margin:0;padding-left:18px;display:grid;gap:7px;color:var(--ink2)}
.prog-list{list-style:none!important;padding:0!important;display:grid;gap:0!important}
.prog-list li{display:flex;gap:14px;align-items:flex-start;padding:0 0 18px;position:relative;color:var(--ink)}
.prog-list li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.prog-list li:last-child::before{display:none}
.prog-list .nn{width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font:700 11px var(--head);flex:none}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pc h3{font-size:.95rem;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.fact{padding:8px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border:0}
.fact .lbl{margin-bottom:4px}
.link{color:var(--blue);font-weight:500}.link:hover{text-decoration:underline}
/* advisor */
.adv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column;height:min(640px,calc(100vh - 220px));min-height:460px}
.chat-log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:84%;padding:12px 15px;border-radius:14px;font-size:14.5px;line-height:1.6;animation:rise .25s ease both}
.msg p+p,.msg p+ul,.msg ul+p{margin-top:8px}
.msg ul{margin:0;padding-left:18px;display:grid;gap:3px}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chat-in{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.chat-in input{flex:1}
.sugg{display:grid;gap:8px}
.sugg button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;color:var(--ink2);transition:.15s}
.sugg button:hover{border-color:var(--blue);color:var(--blue)}
/* roadmap */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px var(--head)}
.stage{padding:0;overflow:hidden}
.stage+.stage{margin-top:12px}
.stage-h{display:flex;align-items:center;gap:14px;padding:16px 20px}
.stage-h .nn{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font:800 13px var(--head);flex:none}
.stage-h.done .nn{background:var(--good-soft);color:var(--good)}
.tasks{border-top:1px solid var(--line);padding:6px 20px 10px}
.task{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:10px 0;font-size:14.5px}
.task .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;transition:.15s;color:#fff}
.task .box .ic{width:13px;height:13px;stroke-width:3;opacity:0}
.task.on .box{background:var(--good);border-color:var(--good)}
.task.on .box .ic{opacity:1}
.task.on span{color:var(--ink3);text-decoration:line-through}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:24px}
.c5{grid-column:span 5}.c7{grid-column:span 7}.c4{grid-column:span 4}.c8{grid-column:span 8}.c6{grid-column:span 6}.c12{grid-column:span 12}
.dash h3{font-size:1rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-size:14px}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(8,14,34,.5);display:grid;place-items:center;padding:20px;z-index:80;animation:rise .2s ease both}
.modal{max-width:440px;width:100%;padding:28px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:90;box-shadow:var(--shadow-lg);animation:rise .2s ease both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:980px){
  .hero .wrap,.split{grid-template-columns:minmax(0,1fr);gap:36px}
  .hero .wrap{padding-block:48px 56px}
  .cats,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail,.adv{grid-template-columns:minmax(0,1fr)}
  .c5,.c7,.c4,.c8,.c6{grid-column:span 12}
  .nav{display:none}.hdr-cta{display:none}.burger{display:grid}
  .hdr.open .wrap{flex-wrap:wrap;height:auto;row-gap:0;padding-bottom:16px}
  .hdr.open .logo,.hdr.open .burger{height:64px}
  .hdr.open .nav{display:flex;order:3;width:100%;flex-direction:column;margin:0}
  .hdr.open .hdr-cta{display:flex;order:4;width:100%;margin:10px 0 0}
}
@media (max-width:620px){
  .steps,.g2,.g3,.pc,.why-body,.foot .cols{grid-template-columns:minmax(0,1fr)}
  .cats{grid-template-columns:minmax(0,1fr)}
  .win-body{grid-template-columns:minmax(0,1fr)}
  .rec-top{flex-wrap:wrap}.score{text-align:left;order:3;width:100%}
  .trait-row{grid-template-columns:minmax(0,110px) minmax(0,1fr) 34px}
  .q-card{padding:20px}
  .msg{max-width:94%}
  .likert button{padding:14px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

const byId = id => CAREERS.find(c => c.id === id);

/* ---------- store (localStorage behind one small API; swap for a backend later) ---------- */
const KEY = 'career-navigator-ai.v1';
const defaults = () => ({ answers:{}, step:0, done:false, saved:[], roadmaps:{}, activeRm:null, activity:[], chat:[], name:'' });
let S = (() => { try { const r = localStorage.getItem(KEY); if (r) return Object.assign(defaults(), JSON.parse(r)); } catch (e) {} return defaults(); })();
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const log = m => { S.activity.unshift({ t:Date.now(), m }); S.activity = S.activity.slice(0, 20); };
let UI = { confirmReset:false, openKeys:new Set(), anim:false };

/* ---------- scoring ---------- */
function qMax() {
  const m = {}; TK.split('').forEach(k => m[k] = 0);
  QS.forEach(q => TK.split('').forEach(k => {
    m[k] += q.type === 'likert' ? (q.w[k] || 0) : Math.max(0, ...q.o.map(o => o[1][k] || 0));
  }));
  return m;
}
const QMAX = qMax();
const answeredAll = () => QS.every(q => S.answers[q.id] !== undefined);
function computeProfile() {
  if (!S.done || !answeredAll()) return null;
  const raw = {}; TK.split('').forEach(k => raw[k] = 0);
  QS.forEach(q => {
    const a = S.answers[q.id];
    if (q.type === 'likert') TK.split('').forEach(k => raw[k] += (q.w[k] || 0) * (a - 1) / 4);
    else TK.split('').forEach(k => raw[k] += (q.o[a][1][k] || 0));
  });
  const norm = TK.split('').map(k => QMAX[k] ? raw[k] / QMAX[k] : 0);
  const top = Math.max(...norm) || 1;
  return norm.map(n => Math.round(n / top * 92));   // relative to the person's own strongest trait
}
function scoreCareer(u, c) {
  const U = u.map(x => x / 100), W = c.w.map(x => x / 3);
  let dot = 0, su = 0, sw = 0, sww = 0;
  U.forEach((x, i) => { dot += x * W[i]; su += x * x; sww += W[i] * W[i]; sw += W[i]; });
  const cos = dot / Math.sqrt((su * sww) || 1), wavg = dot / (sw || 1);
  return Math.max(35, Math.min(97, Math.round(100 * (0.4 * cos + 0.6 * wavg))));
}
const bandOf = s => s >= 72 ? 'Strong match' : s >= 60 ? 'Good match' : 'Worth exploring';
function explain(u, c) {
  const rows = c.w.map((w, i) => ({ i, w, v:u[i], c:(u[i] / 100) * (w / 3) })).filter(r => r.w > 0);
  const top = rows.slice().sort((a, b) => b.c - a.c).slice(0, 3);
  const gaps = rows.filter(r => r.w >= 2 && r.v < 50).sort((a, b) => a.v - b.v).slice(0, 2);
  return { top, gaps };
}
let _rec = null, _recKey = '';
function recs() {
  const u = computeProfile(); if (!u) return [];
  const k = JSON.stringify(S.answers) + S.done;
  if (k !== _recKey) { _rec = CAREERS.map(c => ({ c, s:scoreCareer(u, c) })).sort((a, b) => b.s - a.s); _recKey = k; }
  return _rec;
}
const matchOf = id => { const r = recs().find(x => x.c.id === id); return r ? r.s : null; };
const wordW = w => w >= 3 ? 'relies heavily on' : w === 2 ? 'draws a lot on' : 'draws a little on';

function focusCareer(q, ctx) {

}

    ['Develop professional skills','briefcase',['Look for an internship, volunteering or job-shadowing opportunity',`Learn one more skill from this list: ${sk.slice(3).join(', ')}`,'Join a club, competition or online community in this field']]
  ].map((s, i) => ({ id:'s' + i, title:s[0], icon:s[1], tasks:s[2].map((tx, j) => ({ id:`s${i}t${j}`, text:tx })) }));
}
function rmProgress(id) {
  const c = byId(id), st = buildRoadmap(c), done = S.roadmaps[id] || {};
  const all = st.flatMap(s => s.tasks), n = all.filter(x => done[x.id]).length;
  return { st, n, total:all.length, pct:Math.round(100 * n / all.length), done };
}

/* ---------- charts ---------- */
function radar(vals, labels = true) {
  const cx = 230, cy = 175, R = 112, N = 8;
  const pt = (i, r) => { const a = (-90 + i * 45) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = f => Array.from({ length:N }, (_, i) => pt(i, R * f).join(',')).join(' ');
  const poly = vals.map((v, i) => pt(i, R * v / 100).join(',')).join(' ');
  const lab = labels ? TRAITS.map((tr, i) => {
    const [x, y] = pt(i, R + 16), c = Math.cos((-90 + i * 45) * Math.PI / 180);
    return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${Math.abs(c) < .2 ? 'middle' : c > 0 ? 'start' : 'end'}" font-size="11.5" font-weight="500" fill="var(--ink2)">${tr.short}</text>`;
  }).join('') : '';
  return `<svg viewBox="0 0 460 350" role="img" aria-label="Radar chart of eight interest areas" style="width:100%;height:auto;display:block">
    ${[.25,.5,.75,1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${Array.from({ length:N }, (_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, R)[0].toFixed(1)}" y2="${pt(i, R)[1].toFixed(1)}" stroke="var(--line)"/>`).join('')}
    <polygon points="${poly}" fill="var(--blue)" fill-opacity=".16" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v, i) => `<circle cx="${pt(i, R * v / 100)[0].toFixed(1)}" cy="${pt(i, R * v / 100)[1].toFixed(1)}" r="3.5" fill="var(--blue)"/>`).join('')}
    ${lab}</svg>`;
}
function ring(p) {
  const r = 40, c = 2 * Math.PI * r;
  return `<div class="ring"><svg viewBox="0 0 96 96" width="96" height="96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--blue)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * p / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 48 48)"/></svg><b>${p}%</b></div>`;
}

function viewCareer(id) {
  const c = byId(id);
  if (!c) return `<div class="wrap page"><div class="empty">That career was not found. <a class="link" href="#explorer">Back to the Explorer</a></div></div>`;
  const m = matchOf(c.id), rl = c.rel.map(byId), has = S.roadmaps[c.id];
  const list = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<div class="wrap page"><a class="link small" href="#explorer">← All careers</a>
    <div class="row between" style="margin-top:14px;align-items:flex-start"><div class="row" style="gap:16px;align-items:flex-start"><div class="tile" style="width:52px;height:52px">${ico(CATICON[c.cat], '')}</div>
      <div><div class="row" style="gap:8px"><span class="tag">${esc(c.cat)}</span><span class="chip">${EDU[c.edu]}</span></div><h1 class="h-page" style="margin:10px 0 0">${esc(c.title)}</h1></div></div>
      <div class="row">${m ? `<span class="match-b" style="font-size:13px;padding:6px 10px">~${m}% match for you</span>` : ''}<button class="btn btn-ghost" data-a="save" data-id="${c.id}">${ico('bookmark')}${S.saved.includes(c.id) ? 'Saved' : 'Save'}</button><button class="btn btn-primary" data-a="rmgen" data-id="${c.id}">${ico('map')}${has ? 'Open roadmap' : 'Build roadmap'}</button></div></div>
    <div class="detail"><div>
      <section class="card panel"><h2>Overview</h2><p class="muted">${esc(c.overview)}</p></section>
      <section class="card panel"><h2>Typical responsibilities</h2>${list(c.resp)}</section>
      <section class="card panel"><h2>Career progression</h2><ul class="prog-list">${c.prog.map((p, i) => `<li><span class="nn">${i + 1}</span><span>${esc(p)}</span></li>`).join('')}</ul><p class="tiny">Titles and timelines vary between employers and countries.</p></section>
      <section class="card panel"><div class="pc"><div><h3 style="color:var(--good)">${ico('thumbs-up')}Advantages</h3>${list(c.pros)}</div><div><h3 style="color:var(--warn)">${ico('triangle-alert')}Challenges</h3>${list(c.cons)}</div></div></section>
      <section class="card panel"><h2>Future outlook</h2><p class="muted">${esc(c.outlook)}</p><p class="tiny" style="margin-top:8px">Qualitative view only. Check your national labour statistics for current figures.</p></section>
      <section class="card panel"><h2>Suggested learning resources</h2><ul>${c.res.map(r => `<li><a class="link" href="${r[1]}" target="_blank" rel="noopener">${esc(r[0])}</a></li>`).join('')}</ul></section>
      <section class="card panel"><h2>Related careers</h2><div class="grid g3">${rl.map(r => `<a class="card pad" style="box-shadow:none" href="#career-${r.id}"><div class="tile" style="width:34px;height:34px">${ico(CATICON[r.cat])}</div><b style="display:block;margin-top:10px;font-size:14px">${esc(r.title)}</b><span class="tiny">${esc(r.cat)}</span></a>`).join('')}</div></section>
    </div>
    <aside class="card panel" style="position:sticky;top:84px"><h2>Quick facts</h2>
      <div class="fact"><span class="lbl">Required skills</span><div class="chips">${c.skills.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div></div>
      <div class="fact"><span class="lbl">School subjects</span><div class="chips">${c.subjects.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div></div>
      <div class="fact"><span class="lbl">University majors</span>${c.majors.map(s => `<div class="small">${esc(s)}</div>`).join('')}</div>
      <div class="fact"><span class="lbl">Potential industries</span><div class="chips">${c.ind.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div></div>
      <div class="fact"><span class="lbl">Education path</span><p class="small muted">${esc(c.eduNote)}</p></div></aside></div></div>`;
}

function viewAdvisor() {
  const ctx = advisorContext(), top = ctx.recs[0];
  const prompts = ['Why did you recommend this career?', 'What other careers might suit me?', 'What should I study at university?', 'How do I start learning this field?', 'What are the disadvantages of this career?', 'What skills should I develop?', 'Can I switch from this career to another?'];
  return `<div class="wrap page"><div class="eyebrow">AI Career Advisor</div><h1 class="h-page" style="margin-top:8px">Ask about your path</h1>
    <div class="callout" style="margin:12px 0 22px">${ico('info')}<div><b>Demo mode.</b> Replies are generated locally from your results and the career data in this app. No AI service is connected, and no API key is stored in the page.</div></div>
    <div class="adv"><div class="card chat"><div class="chat-log" id="log" aria-live="polite"></div>
      <form class="chat-in" id="chatForm"><input type="text" id="chatIn" placeholder="Ask about a career, your results or what to study" aria-label="Your question" autocomplete="off"><button class="btn btn-primary" type="submit" aria-label="Send">${ico('send')}</button></form></div>
    <aside class="grid" style="gap:14px"><div class="card pad"><h3 style="font-size:.95rem;margin-bottom:10px">Context I am using</h3>
      <div class="small muted" style="display:grid;gap:6px"><span>${ico('user', '')} Profile: ${ctx.profile ? 'completed' : 'not yet taken'}</span>
      <span>${ico('target', '')} Top match: ${top ? esc(top.c.title) : 'none yet'}</span><span>${ico('bookmark', '')} Saved careers: ${ctx.saved.length ? ctx.saved.map(c => esc(c.title)).join(', ') : 'none'}</span></div>
      ${ctx.profile ? '' : `<a class="btn btn-soft btn-sm" style="margin-top:12px" href="#assessment">Take the assessment</a>`}</div>
    <div class="card pad"><h3 style="font-size:.95rem;margin-bottom:10px">Try asking</h3><div class="sugg">${prompts.map(p => `<button data-a="ask" data-text="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>
      ${S.chat.length ? `<button class="btn btn-ghost btn-sm" data-a="clearchat">Clear conversation</button>` : ''}</aside></div></div>`;
}
function msgHTML(m) { return `<div class="msg ${m.r}">${m.r === 'u' ? esc(m.h) : m.h}</div>`; }
function paintChat() {
  const l = $('#log'); if (!l) return;
  const hello = `<div class="msg a"><p>Hi, I am your career advisor demo. ${S.done ? 'I have your assessment results and can explain any match.' : 'Take the assessment so I can use your results, or ask me about any career.'}</p><p>Pick a question on the right or type your own.</p></div>`;
  l.innerHTML = hello + S.chat.map(msgHTML).join('');
  l.scrollTop = l.scrollHeight;
  if (window.lucide) lucide.createIcons();
}
async function ask(text) {
  text = text.trim(); if (!text) return;
  const l = $('#log'); if (!l) return;
  S.chat.push({ r:'u', h:text }); l.insertAdjacentHTML('beforeend', msgHTML({ r:'u', h:text }));
  l.insertAdjacentHTML('beforeend', `<div class="msg a" id="typing"><span class="typing"><i></i><i></i><i></i></span></div>`);
  l.scrollTop = l.scrollHeight;
  let html; try { html = await Advisor.ask(text, advisorContext()); } catch (e) { html = '<p>Something went wrong. Please try again.</p>'; }
  const ty = $('#typing'); if (ty) ty.remove();
  S.chat.push({ r:'a', h:html }); S.chat = S.chat.slice(-30);
  if (route() === 'advisor') { l.insertAdjacentHTML('beforeend', msgHTML({ r:'a', h:html })); l.scrollTop = l.scrollHeight; }
  log('Asked the advisor: ' + text.slice(0, 50)); persist();
}

function viewRoadmap() {
  const ids = Object.keys(S.roadmaps), act = S.activeRm && S.roadmaps[S.activeRm] ? S.activeRm : ids[0];
  const sug = [...new Set([...S.saved, ...recs().slice(0, 4).map(r => r.c.id)])].filter(i => !S.roadmaps[i]).slice(0, 6);
  const picker = `<div class="card pad" style="margin-top:20px"><h3 style="font-size:1rem">${ids.length ? 'Start another roadmap' : 'Choose a career to start'}</h3>
    <p class="muted small" style="margin:6px 0 14px">${sug.length ? 'From your saved careers and top matches:' : 'Pick any career:'}</p>
    <div class="row">${sug.map(i => `<button class="btn btn-soft btn-sm" data-a="rmgen" data-id="${i}">${esc(byId(i).title)}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px;gap:8px"><label class="sr" for="rmSel">Choose a career</label><select id="rmSel" style="max-width:320px">${CAREERS.filter(c => !S.roadmaps[c.id]).map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><button class="btn btn-primary btn-sm" data-a="rmsel">${ico('map')}Generate roadmap</button></div></div>`;
  if (!act) return `<div class="wrap page"><div class="eyebrow">Personal Roadmap</div><h1 class="h-page" style="margin-top:8px">Turn a career into a plan</h1><p class="muted">Choose a career and get eight stages of tasks, from exploring it to preparing your applications.</p>${picker}</div>`;
  const c = byId(act), p = rmProgress(act);
  return `<div class="wrap page"><div class="eyebrow">Personal Roadmap</div><h1 class="h-page" style="margin-top:8px">Your path to ${esc(c.title)}</h1>
    ${ids.length > 1 ? `<div class="chips" style="margin:6px 0 16px">${ids.map(i => `<button class="chip ${i === act ? 'on' : ''}" data-a="rmtab" data-id="${i}">${esc(byId(i).title)}</button>`).join('')}</div>` : ''}
    <div class="card pad row" style="gap:20px;margin:16px 0 20px">${ring(p.pct)}<div style="flex:1;min-width:200px"><h3 style="font-size:1.05rem">${p.n} of ${p.total} tasks done</h3><p class="muted small" style="margin:4px 0 12px">${p.pct === 100 ? 'Roadmap complete. Nice work.' : 'Tick tasks as you finish them. Progress is saved on this device.'}</p>${bar(p.pct)}</div>
      <div class="row"><a class="btn btn-ghost btn-sm" href="#career-${c.id}">View career</a><button class="btn btn-ghost btn-sm" data-a="rmreset" data-id="${c.id}">${ico('rotate-ccw')}Reset ticks</button></div></div>
    ${p.st.map((s, i) => { const n = s.tasks.filter(x => p.done[x.id]).length, d = n === s.tasks.length;
      return `<section class="card stage"><div class="stage-h ${d ? 'done' : ''}"><span class="nn">${d ? ico('check') : i + 1}</span><div style="flex:1"><h3 style="font-size:1rem">${s.title}</h3></div><span class="tiny">${n}/${s.tasks.length}</span></div>
      <div class="tasks">${s.tasks.map(tk => `<button class="task ${p.done[tk.id] ? 'on' : ''}" role="checkbox" aria-checked="${!!p.done[tk.id]}" data-a="task" data-id="${c.id}" data-t="${tk.id}"><span class="box">${ico('check')}</span><span>${esc(tk.text)}</span></button>`).join('')}</div></section>`; }).join('')}
    ${picker}</div>`;
}

function viewDashboard() {
  const u = computeProfile(), r = recs(), saved = S.saved.map(byId).filter(Boolean), rms = Object.keys(S.roadmaps);
  const order = u ? u.map((v, i) => ({ v, i })).sort((a, b) => b.v - a.v).slice(0, 4) : [];
  const fmt = ts => new Date(ts).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  return `<div class="wrap page"><div class="row between" style="align-items:flex-end"><div><div class="eyebrow">Dashboard</div>
    <h1 class="h-page" style="margin-top:8px">Welcome back${S.name ? ', ' + esc(S.name) : ''}</h1><p class="muted">${u ? 'Here is where you stand and what to do next.' : 'Start with the assessment, and your profile and matches will appear here.'}</p></div>
    <div class="row"><label class="sr" for="nm">Your name</label><input type="text" id="nm" placeholder="Add your name" value="${esc(S.name)}" style="width:170px" maxlength="30"></div></div>
    <div class="row" style="margin-top:18px"><a class="btn btn-primary" href="#assessment">${ico('target')}${u ? 'Retake assessment' : Object.keys(S.answers).length ? 'Continue assessment' : 'Start assessment'}</a><a class="btn btn-ghost" href="#advisor">${ico('sparkles')}Ask the AI advisor</a><a class="btn btn-ghost" href="#explorer">${ico('search')}Explore careers</a></div>
    <div class="dash">
      <section class="card pad c5"><h3>Career profile${u ? '<a class="link small" href="#results">Full results</a>' : ''}</h3>
        ${u ? `${radar(u, false)}<div style="margin-top:4px">${order.map(o => `<div class="trait-row"><b>${TRAITS[o.i].short}</b>${bar(o.v)}<span class="v">${o.v}</span></div>`).join('')}</div>` : `<div class="empty">No profile yet.<br>18 questions, about 8 minutes.</div>`}</section>
      <section class="card pad c7"><h3>Recommended careers${u ? '<a class="link small" href="#results">See all</a>' : ''}</h3>
        ${u ? r.slice(0, 5).map(x => `<div class="li"><span class="tile" style="width:36px;height:36px">${ico(CATICON[x.c.cat])}</span><div class="grow"><a href="#career-${x.c.id}"><b>${esc(x.c.title)}</b></a><span class="tiny">${esc(x.c.cat)} · ${bandOf(x.s)}</span></div><span class="match-b">~${x.s}%</span>${saveBtn(x.c.id)}</div>`).join('') : `<div class="empty">Matches appear after the assessment.</div>`}</section>
      <section class="card pad c6"><h3>Saved careers</h3>${saved.length ? saved.map(c => `<div class="li"><span class="tile" style="width:36px;height:36px">${ico(CATICON[c.cat])}</span><div class="grow"><a href="#career-${c.id}"><b>${esc(c.title)}</b></a><span class="tiny">${esc(c.cat)}</span></div>${saveBtn(c.id)}</div>`).join('') : `<div class="empty">Nothing saved yet. Use the bookmark on any career in the <a class="link" href="#explorer">Explorer</a>.</div>`}</section>
      <section class="card pad c6"><h3>Roadmap progress<a class="link small" href="#roadmap">${rms.length ? 'Open' : 'Create'}</a></h3>${rms.length ? rms.map(i => { const p = rmProgress(i); return `<div class="li"><div class="grow"><a href="#roadmap" data-a="rmtab" data-id="${i}"><b>${esc(byId(i).title)}</b></a>${bar(p.pct)}</div><span class="v small" style="font-weight:700">${p.pct}%</span></div>`; }).join('') : `<div class="empty">No roadmap yet. Pick a career and generate one.</div>`}</section>
      <section class="card pad c12"><h3>Recent activity</h3>${S.activity.length ? S.activity.slice(0, 6).map(a => `<div class="li"><span class="tiny" style="width:120px;flex:none">${fmt(a.t)}</span><span class="grow small">${esc(a.m)}</span></div>`).join('') : `<div class="empty">Your actions will show up here.</div>`}</section>
    </div>
    <div style="margin-top:28px" class="row"><span class="tiny">Everything is stored only in this browser.</span>
      ${UI.confirmReset ? `<button class="btn btn-sm" style="background:var(--warn-soft);color:var(--warn)" data-a="reset-yes">Yes, erase all my data</button><button class="btn btn-ghost btn-sm" data-a="reset-no">Cancel</button>` : `<button class="btn btn-ghost btn-sm" data-a="reset">Erase my data</button>`}</div></div>`;
}

function viewModal(kind) {
  const label = kind === 'signup' ? 'Sign up' : 'Log in';
  return `<div class="modal-bg" data-a="modal-close"><div class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt" data-stop="1">
    <div class="tile">${ico('shield-check')}</div><h2 id="mt" style="font-size:1.3rem;margin:14px 0 8px">${label} is not available yet</h2>
    <p class="muted">This prototype has no accounts. Everything you do is saved only in this browser, so there is nothing to sign in to. Real accounts with secure authentication will be added together with a backend.</p>
    <div class="row" style="margin-top:20px"><a class="btn btn-primary" href="#assessment" data-a="modal-close">Continue without an account</a><button class="btn btn-ghost" data-a="modal-close">Close</button></div></div></div>`;
}

/* ---------- render ---------- */
let lastRoute = null;
function render() {
  const r = route(); let v;
  if (r === 'home') v = viewHome();
  else if (r === 'assessment') v = viewAssessment();
  else if (r === 'results') v = viewResults();
  else if (r === 'explorer') v = viewExplorer();
  else if (r.startsWith('career-')) v = viewCareer(r.slice(7));
  else if (r === 'advisor') v = viewAdvisor();
  else if (r === 'roadmap') v = viewRoadmap();
  else if (r === 'dashboard') v = viewDashboard();
  else v = viewHome();
  $('#app').innerHTML = header() + (r === 'home' ? v : `<main>${v}</main>`) + footer();
  UI.anim = false;
  if (window.lucide) lucide.createIcons();
  if (r === 'explorer') fillGrid();
  if (r === 'advisor') paintChat();
  if (lastRoute !== r && !UI.keepScroll) window.scrollTo(0, 0);
  UI.keepScroll = false; lastRoute = r;
  const titles = { home:'Career Navigator AI', assessment:'Assessment', results:'Your results', explorer:'Discover careers', advisor:'AI Advisor', roadmap:'Roadmap', dashboard:'Dashboard' };
  document.title = r.startsWith('career-') && byId(r.slice(7)) ? byId(r.slice(7)).title + ' · Career Navigator AI' : (titles[r] || 'Career Navigator AI') + (r === 'home' ? '' : ' · Career Navigator AI');
}
function toast(m) {
  const h = $('#toast-host'); h.innerHTML = `<div class="toast" role="status">${esc(m)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => h.innerHTML = '', 2200);
}
function go(h) { UI.menu = false; if (location.hash.slice(1) === h) render(); else location.hash = h; }
function openRoadmap(id) {
  if (!S.roadmaps[id]) { S.roadmaps[id] = {}; log('Generated a roadmap for ' + byId(id).title); }
  S.activeRm = id; persist(); go('roadmap');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, d = el.dataset;
  if (a === 'modal-close' && e.target.closest('[data-stop]') && !el.closest('[data-stop]') ) return;
  if (el.matches('.modal-bg') && e.target.closest('.modal')) return;
  if (a !== 'scroll' && el.tagName === 'A' && a !== 'modal-close') { /* normal link */ }
  UI.keepScroll = true;
  switch (a) {
    case 'menu': UI.menu = !UI.menu; render(); return;
    case 'modal': $('#modal').innerHTML = viewModal(d.m); if (window.lucide) lucide.createIcons(); UI.menu = false; return;
    case 'modal-close': $('#modal').innerHTML = ''; return;
    case 'scroll': { e.preventDefault(); UI.menu = false; const done = () => { const t = document.getElementById(d.to); if (t) t.scrollIntoView({ behavior:'smooth' }); };
      if (route() !== 'home') { UI.keepScroll = true; location.hash = 'home'; setTimeout(done, 60); } else { render(); setTimeout(done, 30); } return; }
    case 'cat': F.cat = d.c; F.skills = []; F.q = ''; F.edu = 'all'; UI.keepScroll = false; go('explorer'); return;
    case 'fcat': F.cat = d.c; render(); return;
    case 'fskill': F.skills = F.skills.includes(d.s) ? F.skills.filter(x => x !== d.s) : [...F.skills, d.s]; render(); return;
    case 'fclear': F.q = ''; F.cat = 'All'; F.edu = 'all'; F.skills = []; render(); return;
    case 'save': {
      const id = d.id, was = S.saved.includes(id);
      S.saved = was ? S.saved.filter(x => x !== id) : [...S.saved, id];
      log((was ? 'Removed from saved: ' : 'Saved career: ') + byId(id).title); persist(); toast(was ? 'Removed from saved' : 'Saved to your list');
      if (route() === 'explorer') { fillGrid(); } else render();
      return; }
    case 'ans': {
      const q = QS[S.step]; S.answers[q.id] = Number(d.v); persist(); render(); return; }
    case 'next': {
      if (S.answers[QS[S.step].id] === undefined) return;
      if (S.step < QS.length - 1) { S.step++; UI.anim = true; persist(); render(); }
      else { S.done = true; log('Completed the career assessment'); persist(); UI.keepScroll = false; go('results'); }
      return; }
    case 'back': if (S.step > 0) { S.step--; UI.anim = true; persist(); render(); } return;
    case 'retake': S.done = false; S.step = 0; persist(); render(); return;
    case 'rmgen': openRoadmap(d.id); return;
    case 'rmsel': openRoadmap($('#rmSel').value); return;
    case 'rmtab': S.activeRm = d.id; persist(); if (route() === 'roadmap') render(); else go('roadmap'); return;
    case 'rmreset': S.roadmaps[d.id] = {}; persist(); render(); return;
    case 'task': {
      const m = S.roadmaps[d.id] || (S.roadmaps[d.id] = {}); m[d.t] = !m[d.t];
      if (m[d.t]) { const tx = rmProgress(d.id); log(`Completed a roadmap task for ${byId(d.id).title} (${tx.pct}%)`); } persist(); render(); return; }
    case 'ask': ask(d.text); return;
    case 'clearchat': S.chat = []; persist(); render(); return;
    case 'reset': UI.confirmReset = true; render(); return;
    case 'reset-no': UI.confirmReset = false; render(); return;
    case 'reset-yes': S = defaults(); UI.confirmReset = false; persist(); toast('Data erased'); render(); return;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { F.q = e.target.value; fillGrid(); }
  if (e.target.id === 'nm') { S.name = e.target.value.slice(0, 30); persist(); }
});
document.addEventListener('change', e => { if (e.target.id === 'edu') { F.edu = e.target.value; UI.keepScroll = true; render(); } });
document.addEventListener('submit', e => {
  if (e.target.id === 'chatForm') { e.preventDefault(); const i = $('#chatIn'); const v = i.value; i.value = ''; ask(v); }
});
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { e.target.open ? UI.openKeys.add(k) : UI.openKeys.delete(k); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) $('#modal').innerHTML = ''; });
window.addEventListener('hashchange', () => { UI.menu = false; $('#modal').innerHTML = ''; render(); });
render();
</script>

</body></html>
